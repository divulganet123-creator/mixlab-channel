name: Compilar VST3 (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empacotar
        shell: pwsh
        run: |
          $d = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse $d.FullName dist/

      - uses: actions/upload-artifact@v4
        with:
          name: MixLab-Channel-VST3
          path: dist
